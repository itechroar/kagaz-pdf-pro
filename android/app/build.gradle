plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.kagazsoftware.pdf'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kagazsoftware.pdf'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            def ks = System.getenv('KAGAZ_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KAGAZ_KEYSTORE_PASSWORD')
                keyAlias System.getenv('KAGAZ_KEY_ALIAS')
                keyPassword System.getenv('KAGAZ_KEY_PASSWORD')
            }
        }
    }
    buildFeatures { buildConfig true }
    flavorDimensions 'role'
    productFlavors {
        user {
            dimension 'role'
            resValue 'string', 'app_name', 'Kagaz PDF'
            buildConfigField 'String', 'START_PATH', '"/"'
        }
        admin {
            dimension 'role'
            applicationIdSuffix '.admin'
            versionNameSuffix '-admin'
            resValue 'string', 'app_name', 'Kagaz PDF Admin'
            buildConfigField 'String', 'START_PATH', '"/admin-dashboard.html"'
        }
    }
    buildTypes {
        release {
            signingConfig System.getenv('KAGAZ_KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    testImplementation 'junit:junit:4.13.2'
}
