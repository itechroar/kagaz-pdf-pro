services:
  kagaz-pdf:
    build:
      context: ../..
      dockerfile: docker/embedded/Dockerfile.fat
    container_name: kagaz-pdf-fat
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6G
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080$${SYSTEM_ROOTURIPATH:-''}/api/v1/info/status | grep -q 'UP'"]
      interval: 5s
      timeout: 10s
      retries: 16
    ports:
      - "8080:8080"
    volumes:
      - ../../kagaz/latest/data:/usr/share/tessdata:rw
      - ../../kagaz/latest/config:/configs:rw
      - ../../kagaz/latest/logs:/logs:rw
    environment:
      DISABLE_ADDITIONAL_FEATURES: "false"
      SECURITY_ENABLELOGIN: "false"
      FAT_DOCKER: "true"
      SYSTEM_DEFAULTLOCALE: en-US
      UI_APPNAME: Kagaz-PDF
      UI_HOMEDESCRIPTION: Full-featured Kagaz-PDF with all capabilities
      UI_APPNAMENAVBAR: Kagaz-PDF Fat
      SYSTEM_MAXFILESIZE: "200"
      METRICS_ENABLED: "true"
      SYSTEM_GOOGLEVISIBILITY: "true"
      SHOW_SURVEY: "true"
    networks:
      - kagaz-network

networks:
  kagaz-network:
    driver: bridge

volumes:
  kagaz-data:
  kagaz-config:
  kagaz-logs:
