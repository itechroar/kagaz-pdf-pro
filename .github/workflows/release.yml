name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: go-task/setup-task@v1
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build server jar
        shell: bash
        run: ./gradlew :kagaz-pdf:bootJar -PbuildWithFrontend=true -x test -x spotlessApply -x spotlessCheck
      - name: Stage server and bundled JRE
        shell: bash
        run: |
          mkdir -p desktop/resources
          cp "$(ls app/core/build/libs/*.jar | grep -v plain | head -1)" desktop/resources/kagaz-pdf.jar
          jlink --add-modules "$(java --list-modules | cut -d@ -f1 | grep -v -E "^jdk\.(jlink|jpackage)$" | paste -sd, -)" --strip-debug --no-header-files --no-man-pages --output desktop/resources/jre
      - name: Start the bundled server once (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/kagaz-data"
          desktop/resources/jre/bin/java -Xmx1g -Dserver.port=18080 -Dserver.address=127.0.0.1 -Dsecurity.enableLogin=false -Dkagaz.base-path="$RUNNER_TEMP/kagaz-data/" -jar desktop/resources/kagaz-pdf.jar > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/v1/info/status || true)
            if [ "$code" -ge 100 ] && [ "$code" -lt 500 ]; then
              echo "bundled server is up (HTTP $code)"
              if curl -s http://127.0.0.1:18080/ | grep -qi "API-only mode"; then echo "jar was built without the web interface"; exit 1; fi
              exit 0
            fi
            sleep 3
          done
          tail -n 80 "$RUNNER_TEMP/server.log"
          exit 1
      - name: Build installer
        shell: bash
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Restore signing key
        if: env.KAGAZ_KEYSTORE_B64 != ''
        env:
          KAGAZ_KEYSTORE_B64: ${{ secrets.KAGAZ_KEYSTORE_B64 }}
        run: echo "$KAGAZ_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kagaz.jks"
      - name: Build APK
        env:
          KAGAZ_KEYSTORE_B64: ${{ secrets.KAGAZ_KEYSTORE_B64 }}
          KAGAZ_KEYSTORE_PASSWORD: ${{ secrets.KAGAZ_KEYSTORE_PASSWORD }}
          KAGAZ_KEY_ALIAS: ${{ secrets.KAGAZ_KEY_ALIAS }}
          KAGAZ_KEY_PASSWORD: ${{ secrets.KAGAZ_KEY_PASSWORD }}
        run: |
          if [ -n "$KAGAZ_KEYSTORE_B64" ]; then export KAGAZ_KEYSTORE_FILE="$RUNNER_TEMP/kagaz.jks"; fi
          gradle -p android :app:assembleRelease
          cp android/app/build/outputs/apk/release/app-release*.apk android/app/build/outputs/apk/release/KagazPDF-android.apk
          rm -f android/app/build/outputs/apk/release/app-release*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/*.apk

  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build -f docker/base/Dockerfile -t kagaz-pdf-base:local .
          docker build -f docker/embedded/Dockerfile --build-arg BASE_IMAGE=kagaz-pdf-base:local -t "$IMG:$GITHUB_REF_NAME" -t "$IMG:latest" .
          docker push "$IMG:$GITHUB_REF_NAME"
          docker push "$IMG:latest"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [installers, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
