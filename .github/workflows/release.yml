name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build server jar
        shell: bash
        run: ./gradlew :kagaz-pdf:bootJar -x test
      - name: Stage server and bundled JRE
        shell: bash
        run: |
          mkdir -p desktop/resources
          cp "$(ls app/core/build/libs/*.jar | grep -v plain | head -1)" desktop/resources/kagaz-pdf.jar
          jlink --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.net.http,java.security.jgss,java.sql,java.xml,java.xml.crypto,jdk.unsupported,jdk.crypto.ec,java.instrument,java.compiler --strip-debug --no-header-files --no-man-pages --output desktop/resources/jre
      - name: Build installer
        shell: bash
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Restore signing key
        if: env.KAGAZ_KEYSTORE_B64 != ''
        env:
          KAGAZ_KEYSTORE_B64: ${{ secrets.KAGAZ_KEYSTORE_B64 }}
        run: echo "$KAGAZ_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kagaz.jks"
      - name: Build APK
        env:
          KAGAZ_KEYSTORE_B64: ${{ secrets.KAGAZ_KEYSTORE_B64 }}
          KAGAZ_KEYSTORE_PASSWORD: ${{ secrets.KAGAZ_KEYSTORE_PASSWORD }}
          KAGAZ_KEY_ALIAS: ${{ secrets.KAGAZ_KEY_ALIAS }}
          KAGAZ_KEY_PASSWORD: ${{ secrets.KAGAZ_KEY_PASSWORD }}
        run: |
          if [ -n "$KAGAZ_KEYSTORE_B64" ]; then export KAGAZ_KEYSTORE_FILE="$RUNNER_TEMP/kagaz.jks"; fi
          gradle -p android :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/*.apk

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [installers, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
