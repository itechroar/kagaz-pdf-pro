<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My profile · Kagaz PDF</title><link rel="stylesheet" href="/kagaz-auth/auth.css"></head>
<body><main class="wide">
<nav class="topnav"><b>Kagaz PDF</b><a href="/">PDF tools</a><a class="on" href="/profile.html">My profile</a><span class="sp"></span><a id="adm" href="/admin-dashboard.html" hidden>Admin console</a><a href="#" id="out">Sign out</a></nav>
<div class="card"><h1 id="title">My profile</h1>
<div class="ok" id="welcome" hidden>Your account is ready. Open the PDF tools to get started.</div>
<div class="grid" id="stats"></div>
<dl class="kv" id="info"></dl>
<h2>Most used tools</h2><table><tbody id="tools"></tbody></table>
<h2>Recent activity</h2><table><thead><tr><th>When</th><th>Action</th><th>Detail</th><th>Result</th></tr></thead><tbody id="recent"></tbody></table>
<h2>Change password</h2>
<form id="pw"><label for="cur">Current password</label><input id="cur" type="password" autocomplete="current-password" required>
<label for="new">New password (min 8 characters)</label><input id="new" type="password" autocomplete="new-password" minlength="8" required>
<button type="submit">Update password</button></form>
<div class="err" id="msg" role="alert"></div>
<a class="btn" href="/">Open PDF tools</a>
</div></main>
<script src="/kagaz-auth/session.js"></script><script src="/kagaz-auth/format.js"></script><script src="/kagaz-auth/profile.js"></script></body></html>
